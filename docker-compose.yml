services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tapiceria_lider
      POSTGRES_USER: lider
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Ejecutá npm run setup:local primero}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lider_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lider -d tapiceria_lider"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lider_postgres:
